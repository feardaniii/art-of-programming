<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PR Companion · Presentation Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --panel-2: #f4f3ef;
    --ink: #1a1918;
    --ink-soft: #3f3d3a;
    --muted: #807d76;
    --line: rgba(20,19,18,0.09);
    --line-strong: rgba(20,19,18,0.18);
    --accent: oklch(0.55 0.14 252);
    --accent-soft: oklch(0.55 0.14 252 / 0.10);
    --accent-ink: oklch(0.40 0.14 252);
    --good: oklch(0.62 0.13 150);
    --good-soft: oklch(0.62 0.13 150 / 0.10);
    --warn: oklch(0.70 0.14 60);
    --warn-soft: oklch(0.70 0.14 60 / 0.12);
    --danger: oklch(0.60 0.18 25);
    --pad: 18px;
    --radius: 12px;
    --radius-sm: 8px;
    --row-gap: 14px;
  }
  [data-theme="dark"] {
    --bg: #131211;
    --panel: #1c1b1a;
    --panel-2: #232220;
    --ink: #f4f3ef;
    --ink-soft: #d6d4cf;
    --muted: #908d86;
    --line: rgba(255,253,246,0.10);
    --line-strong: rgba(255,253,246,0.20);
    --accent: oklch(0.72 0.13 252);
    --accent-soft: oklch(0.72 0.13 252 / 0.18);
    --accent-ink: oklch(0.85 0.10 252);
  }
  [data-density="compact"] { --pad: 14px; --row-gap: 10px; }
  [data-density="comfy"]   { --pad: 22px; --row-gap: 18px; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
  }
  code, kbd, pre, .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* layout */
  .shell { max-width: 980px; margin: 0 auto; padding: 0 28px 120px; }

  .topbar {
    position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px);
    background: color-mix(in oklab, var(--bg) 84%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 980px; margin: 0 auto; padding: 12px 28px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .glyph {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-family: "Geist Mono";
    font-size: 12px; font-weight: 600;
  }
  .brand small { color: var(--muted); font-weight: 500; font-size: 12px; }

  .pr-input {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px;
    max-width: 360px; width: 100%; justify-self: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .pr-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pr-input .lbl { font-size: 11px; color: var(--muted); font-family: "Geist Mono"; letter-spacing: 0.02em; text-transform: uppercase; }
  .pr-input input {
    border: 0; background: transparent; color: var(--ink); font: inherit;
    flex: 1; outline: none; font-size: 13px; min-width: 0;
  }
  .pr-input input::placeholder { color: var(--muted); }

  .progress-cluster { display: flex; align-items: center; gap: 10px; }
  .progress-ring { width: 28px; height: 28px; }
  .progress-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .progress-ring .bg { stroke: var(--line); }
  .progress-ring .fg { stroke: var(--accent); transition: stroke-dasharray .3s; }
  .progress-text { font-family: "Geist Mono"; font-size: 12px; color: var(--ink-soft); font-weight: 500; }

  /* hero */
  .hero { padding: 56px 0 32px; }
  .eyebrow {
    font-family: "Geist Mono"; font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted);
  }
  .hero h1 {
    margin: 14px 0 12px; font-size: clamp(34px, 4.6vw, 52px);
    font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; text-wrap: balance;
  }
  .hero p.lede {
    margin: 0; font-size: 17px; line-height: 1.55; color: var(--ink-soft); max-width: 64ch;
    text-wrap: pretty;
  }
  .hero-meta { display: flex; gap: 20px; margin-top: 22px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .hero-meta span b { color: var(--ink); font-weight: 500; }

  /* tool strip */
  .toolstrip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px; margin-top: 36px;
  }
  .tool-btn {
    display: flex; flex-direction: column; gap: 6px;
    text-align: left; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer; color: inherit;
    font: inherit; transition: border-color .15s, transform .15s, background .15s;
  }
  .tool-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .tool-btn .t-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .tool-btn .t-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .tool-btn .t-glyph {
    width: 20px; height: 20px; border-radius: 5px;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent-ink);
    font-family: "Geist Mono"; font-size: 11px; font-weight: 600;
  }

  /* steps */
  .steps { margin-top: 56px; display: flex; flex-direction: column; gap: 22px; }
  .step {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .step.complete { border-color: color-mix(in oklab, var(--good) 35%, var(--line)); }
  .step.active { box-shadow: 0 0 0 1px var(--accent), 0 4px 24px -8px var(--accent-soft); border-color: var(--accent); }

  .step-head {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 16px; align-items: center;
    padding: var(--pad); cursor: pointer;
  }
  .step-num {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; font-family: "Geist Mono";
    font-size: 13px; font-weight: 600;
    background: var(--panel-2); color: var(--ink-soft);
    border: 1px solid var(--line);
    transition: all .2s;
  }
  .step.complete .step-num {
    background: var(--good); color: white; border-color: var(--good);
  }
  .step-title {
    font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3;
  }
  .step-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .step-meta { display: flex; align-items: center; gap: 12px; }
  .pill {
    font-family: "Geist Mono"; font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 999px; color: var(--muted);
    border: 1px solid var(--line); background: var(--panel-2);
    white-space: nowrap;
  }
  .pill.full { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .chev { color: var(--muted); transition: transform .2s; font-size: 13px; }
  .step[data-open="true"] .chev { transform: rotate(180deg); }

  .step-body {
    padding: 0 var(--pad) var(--pad);
    border-top: 1px dashed var(--line);
    margin-top: -1px;
  }
  .step-intro {
    padding: 16px 0;
    color: var(--ink-soft); font-size: 14px; line-height: 1.6;
    max-width: 70ch;
  }
  .step-intro strong { color: var(--ink); font-weight: 600; }
  .step-quote {
    margin: 4px 0 0; padding: 12px 16px;
    background: var(--accent-soft); border-radius: var(--radius-sm);
    color: var(--accent-ink); font-size: 13.5px; font-style: italic;
    border-left: 2px solid var(--accent);
  }

  .checklist { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 0; }
  .check {
    display: grid; grid-template-columns: 22px 1fr;
    gap: 12px; align-items: start;
    padding: 10px 10px 10px 12px; border-radius: 8px;
    cursor: pointer; transition: background .12s;
    line-height: 1.5;
    user-select: none;
  }
  .check:hover { background: var(--panel-2); }
  .check input {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; margin: 1px 0 0;
    border: 1.5px solid var(--line-strong); border-radius: 5px;
    background: var(--panel); cursor: pointer; flex-shrink: 0;
    display: grid; place-items: center;
    transition: all .15s;
  }
  .check input:checked {
    background: var(--ink); border-color: var(--ink);
  }
  .check input:checked::after {
    content: ""; width: 9px; height: 5px;
    border: 2px solid var(--bg); border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .check-text { color: var(--ink-soft); font-size: 14px; }
  .check input:checked + .check-text {
    color: var(--muted); text-decoration: line-through;
    text-decoration-color: var(--line-strong);
    text-decoration-thickness: 1px;
  }

  /* code blocks with copy */
  .code-block {
    position: relative; margin: 10px 0;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .code-block pre {
    margin: 0; padding: 14px 16px; padding-right: 56px;
    font-size: 12.5px; line-height: 1.55; overflow-x: auto;
    color: var(--ink);
  }
  .code-block .copy {
    position: absolute; top: 8px; right: 8px;
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted);
    padding: 4px 9px; border-radius: 6px; cursor: pointer;
    font: 500 11px "Geist Mono"; letter-spacing: 0.02em;
    transition: all .15s;
  }
  .code-block .copy:hover { color: var(--ink); border-color: var(--line-strong); }
  .code-block .copy.copied { color: var(--good); border-color: var(--good); }
  .code-block .label {
    font: 500 10.5px "Geist Mono"; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); padding: 8px 16px 0;
  }

  /* expandable "go deeper" */
  .deeper {
    margin-top: 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm);
    background: color-mix(in oklab, var(--panel-2) 60%, transparent);
  }
  .deeper > summary {
    list-style: none; padding: 11px 14px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--ink-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .deeper > summary::-webkit-details-marker { display: none; }
  .deeper > summary::before {
    content: "+"; font-family: "Geist Mono"; color: var(--accent);
    font-size: 16px; line-height: 1;
  }
  .deeper[open] > summary::before { content: "−"; }
  .deeper > summary .deeper-tag {
    margin-left: auto; font-family: "Geist Mono"; font-size: 10px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .deeper > div {
    padding: 4px 16px 16px; border-top: 1px dashed var(--line);
    color: var(--ink-soft); font-size: 13.5px; line-height: 1.6;
  }
  .deeper ul { margin: 6px 0; padding-left: 22px; }
  .deeper li { margin-bottom: 4px; }

  /* footer + final reminder */
  .reminder {
    margin-top: 40px; padding: 28px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: linear-gradient(135deg, var(--panel) 0%, var(--panel-2) 100%);
  }
  .reminder h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .reminder ul { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
  .reminder ul li::marker { color: var(--accent); }
  .reminder p {
    margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 14px; color: var(--ink); font-style: italic;
  }
  .footer-actions {
    margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .btn {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
    padding: 9px 14px; border-radius: 8px; transition: all .15s;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
  }
  .btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: var(--ink-soft); }
  .btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* modal */
  .modal-bg {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.4);
    display: grid; place-items: center; padding: 24px;
    backdrop-filter: blur(4px);
    animation: fadein .15s;
  }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); width: 100%; max-width: 640px;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
  }
  .modal-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-head .close {
    border: 0; background: var(--panel-2); color: var(--ink-soft);
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    font-size: 16px; line-height: 1;
  }
  .modal-body { padding: 22px; overflow-y: auto; }
  .modal-body p { margin: 0 0 14px; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  .modal-body label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; font-family: "Geist Mono"; }
  .modal-body input[type="text"], .modal-body textarea, .modal-body select {
    width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: inherit; font-size: 13.5px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .modal-body input[type="text"]:focus, .modal-body textarea:focus, .modal-body select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .modal-body textarea { font-family: "Geist Mono"; font-size: 12.5px; line-height: 1.55; resize: vertical; min-height: 120px; }

  .route-card {
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-top: 10px;
    background: var(--panel-2);
  }
  .route-card.match {
    border-color: var(--accent); background: var(--accent-soft);
  }
  .route-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .route-card .route-tag {
    font-family: "Geist Mono"; font-size: 11px; padding: 2px 7px;
    border-radius: 4px; background: var(--ink); color: var(--bg);
  }
  .route-card.match .route-tag { background: var(--accent); }
  .route-card p { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

  .question-block { margin-bottom: 18px; }
  .question-block .q { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt {
    appearance: none; cursor: pointer; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
    color: var(--ink-soft); font: inherit; font-size: 13px;
  }
  .opt:hover { border-color: var(--line-strong); }
  .opt.selected { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .pitfalls { display: flex; flex-direction: column; gap: 10px; }
  .pitfall {
    padding: 12px 14px; background: var(--warn-soft);
    border-radius: var(--radius-sm); font-size: 13px; color: var(--ink);
    border-left: 2px solid var(--warn); line-height: 1.5;
  }

  @media (max-width: 720px) {
    .topbar-inner { grid-template-columns: 1fr; gap: 10px; }
    .pr-input { max-width: none; justify-self: stretch; }
    .progress-cluster { justify-self: end; }
    .step-head { grid-template-columns: 28px 1fr auto; gap: 12px; }
    .step-num { width: 26px; height: 26px; font-size: 12px; }
    .step-title { font-size: 16px; }
    .hero { padding: 36px 0 24px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="steps.jsx"></script>
  <script type="text/babel" src="tools.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
